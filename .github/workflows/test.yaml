name: "CI - Test Features"
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-autogenerated:
    name: "autogenerated (${{ matrix.features }} on ${{ matrix.baseImage }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - coder-login
          - claude-remote-control
        baseImage:
          - "mcr.microsoft.com/devcontainers/base:ubuntu"
          - "mcr.microsoft.com/devcontainers/javascript-node:22"
    steps:
      - uses: actions/checkout@v4

      - name: "Install @devcontainers/cli"
        run: npm install -g @devcontainers/cli

      - name: "Test"
        run: |
          devcontainer features test \
            --skip-scenarios \
            -f "${{ matrix.features }}" \
            -i "${{ matrix.baseImage }}" \
            .

  test-scenarios:
    name: "scenarios"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install @devcontainers/cli"
        run: npm install -g @devcontainers/cli

      # The autogenerated tests run as root against the base image's default
      # user, which cannot reproduce a bug that only shows up for a non-root
      # remoteUser. The scenarios pin remoteUser explicitly.
      - name: "Test scenarios"
        run: |
          devcontainer features test -f coder-login --skip-autogenerated .
          devcontainer features test -f claude-remote-control --skip-autogenerated .
